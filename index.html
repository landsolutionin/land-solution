<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Solution</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html{scroll-behavior:smooth;}
  /* ইন্ডিয়ান ফ্ল্যাগ কালার আভা যুক্ত ব্যাকগ্রাউন্ড */
  body{
    background: linear-gradient(135deg, #fff5e6 0%, #ffffff 50%, #e6ffe6 100%);
    font-family:sans-serif;
  }
  .hero-bg{
    background: linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)), url("https://images.unsplash.com/photo-1500382017468-9049fed747ef");
    background-size:cover;
    background-position:center;
  }
  .modal{display:none;}.modal.active{display:flex;}
</style>
</head>
<body>

<script>
  // ১. পেজ লোড হওয়ার সাথে সাথে সেভ করা রিভিউগুলো দেখানোর জন্য
  window.onload = function() {
    const savedReviews = localStorage.getItem("myReviews");
    if (savedReviews && document.getElementById("reviewList")) {
      document.getElementById("reviewList").innerHTML = savedReviews;
    }
  };

  // ২. রিভিউ সাবমিট লজিক
  const reviewForm = document.getElementById("reviewForm");
  if (reviewForm) {
    reviewForm.addEventListener("submit", function(e) {
      e.preventDefault();
      let name = document.getElementById("reviewName").value;
      let text = document.getElementById("reviewText").value;

      if (name && text) {
        const newReview = document.createElement("div");
        newReview.className = "bg-white p-8 rounded-2xl shadow-sm border border-green-100";
        newReview.innerHTML = `
          <div class="text-yellow-400 mb-4 text-xl">★★★★★</div>
          <p class="text-gray-600 italic mb-6">"${text}"</p>
          <div class="font-semibold text-green-700">— ${name}</div>
        `;
        document.getElementById("reviewList").appendChild(newReview);
        localStorage.setItem("myReviews", document.getElementById("reviewList").innerHTML);
        reviewForm.reset();
      } else {
        alert("অনুগ্রহ করে আপনার নাম এবং মতামত লিখুন।");
      }
    });
  }

  // ৩. ইনকুয়ারি ফর্ম লজিক
  document.getElementById("contactForm").addEventListener("submit",function(e){
    e.preventDefault();
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let message = document.getElementById("message").value;
    let fullMessage = `নতুন Inquiry এসেছে:\n\nনাম: ${name}\nমোবাইল: ${phone}\nবার্তা: ${message}`;
    let encoded = encodeURIComponent(fullMessage);
    window.open(`https://wa.me/message/QAO2M2PEBMPXP1?text=${encoded}`,"_blank");
  });

  // অন্যান্য ফাংশন
  function playMusic(){ document.getElementById("bgMusic").play(); }
  function pauseMusic(){ document.getElementById("bgMusic").pause(); }
  function playWATone(){ document.getElementById("waTone").play(); }
  function openModal(){ document.getElementById("callModal").classList.add("active"); }
  function closeModal(){ document.getElementById("callModal").classList.remove("active"); }
</script>

</body>
</html>
