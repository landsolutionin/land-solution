<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Solution | ল্যান্ড সলিউশন</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark-main: #0b130e; --bg-card-dark: #122217; --primary-glow: #1ebd4d; --accent-gold: #f5a623; --text-light: #ebeeeb; --text-muted: #a0b2a6; }
        body { font-family: 'Hind Siliguri', sans-serif; margin: 0; background-color: var(--bg-dark-main); color: var(--text-light); }
        .header { background: linear-gradient(135deg, #071c0e 0%, #0c3318 100%); padding: 40px 20px; text-align: center; border-bottom: 3px solid var(--primary-glow); }
        .main-title { font-size: 40px; font-weight: 700; color: #fff; margin: 0; text-shadow: 0 0 10px var(--primary-glow); }
        .sub-title { color: var(--accent-gold); font-size: 20px; margin-top: 5px; }
        .container { width: 90%; max-width: 1000px; margin: 30px auto; }
        .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .contact-card { background: var(--bg-card-dark); padding: 25px; border-radius: 12px; text-align: center; border: 1px solid rgba(30, 189, 77, 0.2); }
        .btn { display: block; padding: 12px; color: white; text-decoration: none; border-radius: 6px; margin: 8px 0; font-weight: 600; }
        .btn-wp { background: #25D366; }
        .btn-call { background: #0f75bc; }
        .section-title { font-size: 24px; color: #fff; margin-bottom: 20px; border-left: 4px solid var(--primary-glow); padding-left: 10px; }
        .property-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .property-card { background: var(--bg-card-dark); border-radius: 10px; padding: 15px; }
        .property-img { width: 100%; height: 200px; background: #1a2e21; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary-glow); }
        .form-container { background: var(--bg-card-dark); padding: 25px; border-radius: 12px; margin-top: 40px; }
        .form-group { margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0b130e; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { background: var(--primary-glow); color: black; border: none; padding: 12px; width: 100%; font-weight: 700; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="main-title">ল্যান্ড সলিউশন</h1>
        <div class="sub-title">Land Solution</div>
    </div>

    <div class="container">
        <!-- 🛠️ যোগাযোগ অপশন -->
        <div class="contact-grid">
            <div class="contact-card">
                <h3><i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপ</h3>
                <!-- ভবিষ্যতে হোয়াটসঅ্যাপ নম্বর পরিবর্তন করতে এখানে লিঙ্ক বদলান -->
                <a href="https://wa.me/917980471077" target="_blank" class="btn btn-wp">হোয়াটসঅ্যাপ ১</a>
                <a href="https://wa.me/এখানে_দ্বিতীয়_নম্বরটি_দিন" target="_blank" class="btn btn-wp" style="background:#128C7E;">হোয়াটসঅ্যাপ ২</a>
            </div>
            <div class="contact-card">
                <h3><i class="fas fa-phone-alt"></i> কল করুন</h3>
                <a href="tel:+919163386754" class="btn btn-call">কল: +919163386754</a>
                <a href="tel:+918777341778" class="btn btn-call">কল: +918777341778</a>
            </div>
        </div>

        <!-- 🛠️ ইমেজ গ্যালারি সেকশন (ছবি আপলোডের জন্য) -->
        <h2 class="section-title">আমাদের প্রপার্টিসমূহ</h2>
        <div class="property-grid">
            <!-- ইমেজ আপলোড করার নিয়ম: নিচের src="" এর ভেতর আপনার ছবির অনলাইন লিঙ্ক দিন -->
            <div class="property-card">
                <div class="property-img"><img src="এখানে_ছবি_১_এর_লিঙ্ক_দিন" style="width:100%; height:100%; object-fit:cover;"></div>
                <h3>প্রপার্টি ১</h3>
            </div>
            <div class="property-card">
                <div class="property-img"><img src="এখানে_ছবি_২_এর_লিঙ্ক_দিন" style="width:100%; height:100%; object-fit:cover;"></div>
                <h3>প্রপার্টি ২</h3>
            </div>
        </div>

        <!-- ইনকোয়ারি ফর্ম -->
        <div class="form-container">
            <h2 class="section-title">ইনকোয়ারি ফর্ম</h2>
            <form onsubmit="sendToWhatsApp(event)">
                <div class="form-group"><input type="text" id="name" placeholder="নাম" required></div>
                <div class="form-group"><input type="tel" id="phone" placeholder="ফোন নম্বর" required></div>
                <div class="form-group"><button type="submit" class="btn-submit">সাবমিট করুন</button></div>
            </form>
        </div>
    </div>

    <script>
        function sendToWhatsApp(event) {
            event.preventDefault();
            var name = document.getElementById('name').value;
            var phone = document.getElementById('phone').value;
            var text = "নতুন ইনকোয়ারি: " + name + ", ফোন: " + phone;
            window.open("https://wa.me/917980471077?text=" + encodeURIComponent(text), '_blank');
        }
    </script>
</body>
</html>
