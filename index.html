<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>  ল্যান্ড সলিউশন - আপনার বিশ্বস্ত ঠিকানা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* মিউজিক আইকন এনিমেশন */
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .music-pulse { animation: pulse 2s infinite; }
    </style>
</head>
<body class="bg-gray-50">

    <audio id="bgAudio" loop>
        <source src="bashi.mp3" type="audio/mpeg">
    </audio>

    <div id="clickOverlay" onclick="startMusic()" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/20 backdrop-blur-sm cursor-pointer">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center music-pulse">
            <h2 class="text-2xl font-bold text-green-800">স্বাগতম!</h2>
            <p class="mt-2 text-gray-600">আমাদের ওয়েবসাইটটি ভিজিট করতে এখানে ক্লিক করুন</p>
        </div>
    </div>

    <header class="bg-white p-8 text-center shadow-md">
        <img src="1000025552.png" class="mx-auto w-32 h-32 object-cover rounded-full border-4 border-green-600 mb-4">
        <h1 class="text-3xl font-bold text-green-900"> ল্যান্ড সলিউশন</h1>
        <p class="text-gray-600 italic">সততাই আমাদের প্রতীক, ভরসার অন্য নাম</p>
    </header>

    <section class="max-w-4xl mx-auto my-8 px-4">
        <video controls class="w-full rounded-2xl shadow-xl">
            <source src="170ff846-8207-4ef9-a71d-6f35bc794286-1_all_1013.mp4" type="video/mp4">
        </video>
    </section>

    <section class="max-w-4xl mx-auto my-8 px-4 text-center">
        <h2 class="text-2xl font-bold mb-4">আমাদের অফিসের ঠিকানা</h2>
        <div class="w-full h-80 rounded-2xl overflow-hidden shadow-lg border-2 border-green-600">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3684.7176!2d88.29!3d22.60!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjLCsDM2JzAyLjIiTiA4OMKwMTcnMjQuMCJF!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>

    <div class="fixed bottom-6 right-6 flex flex-col gap-4 z-50">
        <a href="https://wa.me/917980471077" class="bg-green-500 text-white p-4 rounded-full shadow-2xl">💬</a>
        <a href="tel:+917980471077" class="bg-blue-600 text-white p-4 rounded-full shadow-2xl">📞</a>
    </div>

    <script>
        function startMusic() {
            var audio = document.getElementById("bgAudio");
            audio.play();
            document.getElementById("clickOverlay").style.display = "none";
        }
    </script>
</body>
</html>
